[package]
name = "wamr-sys"
description = "Unsafe bindings for wasm-micro-runtime"
license.workspace = true
edition.workspace = true
repository = "https://github.com/bytecodealliance/wamr-rust-sdk"
version = "1.0.0"
readme = "README.md"
categories = ["api-bindings", "wasm"]
keywords = ["api-bindings", "wasm", "webassembly"]
include = [
    "/build.rs",
    "/src/lib.rs",
    "/wasm-micro-runtime/build-scripts",
    "/wasm-micro-runtime/CMakeLists.txt",
    "/wasm-micro-runtime/core/iwasm",
    "/wasm-micro-runtime/core/shared",
    "/wasm-micro-runtime/core/config.h",
    "/wasm-micro-runtime/core/version.h",
    "/README.md",
    "/patches",
]

[dependencies]

[build-dependencies]
bindgen = "0.73"
cc = "1.2"
cmake = "0.1"
# Applies patches/ to a copy of WAMR's source.
diffy = "0.4"

[features]
# What was always built: AOT, the fast interpreter, SIMD and WASI.
default = ["aot", "fast-interp", "simd", "wasi"]
aot = []
fast-interp = []
simd = []
wasi = []
# Builds wamrc, the AOT compiler, for the build machine: needs LLVM
# (LLVM_LIB_CFG_PATH).
wamrc = []
custom-section = []
dump-call-stack = []
esp-idf = []
hw-bound-check = []
llvmjit = []
multi-module = []
name-section = [ "custom-section" ]
std = []
